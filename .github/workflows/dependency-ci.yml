name: Dependency CI
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.20.x'
      - name: Lint with go vet (advisory)
        continue-on-error: true
        run: go vet ./...
      - run: |
          go mod download
          git diff --exit-code -- go.mod go.sum
          go test -vet=off -race -count=1 ./...
          go build ./...
  gate:
    name: Dependency CI Gate
    if: always()
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification job to succeed
        env:
          RESULT: ${{ needs.verify.result }}
        run: test "$RESULT" = success
